name: 'ASSERT safety regression gate'
description: 'Run assert-ai evals in CI and gate pull requests on paired safety regressions.'
author: 'Microsoft Corporation'

inputs:
  config:
    description: 'Path to the assert-ai YAML eval config (e.g. eval/eval_config.yaml).'
    required: true
  baseline:
    description: 'Path or artifact name of the cached baseline run (scores.jsonl + test_set.jsonl). Required after the first run on main.'
    required: false
    default: ''
  azure-api-key:
    description: 'Azure / LiteLLM API key. Exposed as AZURE_API_KEY at runtime.'
    required: false
    default: ''
  azure-api-base:
    description: 'Azure / LiteLLM endpoint base URL. Exposed as AZURE_API_BASE at runtime.'
    required: false
    default: ''
  azure-api-version:
    description: 'Azure API version (e.g. 2024-12-01-preview). Exposed as AZURE_API_VERSION at runtime.'
    required: false
    default: ''
  post-pr-comment:
    description: 'When true and run from a pull_request event, upsert a markdown gate report as a PR comment.'
    required: false
    default: 'true'
  comment-marker:
    description: 'HTML comment marker used to idempotently upsert the PR comment.'
    required: false
    default: '<!-- assert-ai-gate -->'
  fail-on-regression:
    description: 'When true, the action exits 1 if the gate verdict is FAIL. When false, the gate report is still produced but the job stays green.'
    required: false
    default: 'true'
  allow-inconclusive:
    description: 'When true (default), Inconclusive verdicts PASS the gate. Set to false to make Inconclusive WARN.'
    required: false
    default: 'true'
  extras:
    description: "Comma-separated assert-ai extras to install from PyPI (for example: 'regression,otel,langgraph')."
    required: false
    default: 'regression'

outputs:
  gate-verdict:
    description: 'Gate verdict: PASS, WARN, FAIL, FirstRun, TestSetChanged, or Inconclusive.'
    value: ${{ steps.decide.outputs.gate-verdict }}
  gate-report-path:
    description: 'Path to the JSON gate report.'
    value: ${{ steps.decide.outputs.gate-report-path }}
  n-paired-cases:
    description: 'Number of paired test cases used by the statistical gate.'
    value: ${{ steps.decide.outputs.n-paired-cases }}
  pr-comment-url:
    description: 'URL of the posted or updated pull request comment, if any.'
    value: ${{ steps.post-comment.outputs.pr-comment-url }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install assert-ai
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "assert-ai[${{ inputs.extras }}]==0.1.0"

    - name: Freeze the eval config for CI
      shell: bash
      run: |
        python <<'PY'
        import os
        from pathlib import Path

        import yaml

        source = Path("${{ inputs.config }}")
        if not source.is_file():
            raise SystemExit(f"config not found: {source}")

        with source.open("r", encoding="utf-8") as f:
            cfg = yaml.safe_load(f) or {}

        cfg["artifacts_root"] = os.path.join(os.environ["GITHUB_WORKSPACE"], "assert-ai-artifacts")

        frozen = Path("assert-ai.frozen.yaml")
        with frozen.open("w", encoding="utf-8") as f:
            yaml.safe_dump(cfg, f, sort_keys=False)

        print(f"frozen config: {frozen}")
        print(f"artifacts_root: {cfg['artifacts_root']}")
        PY

    - name: Resolve baseline input
      id: resolve-baseline
      shell: bash
      run: |
        baseline="${{ inputs.baseline }}"
        if [ -z "$baseline" ]; then
          echo "baseline-status=missing" >> "$GITHUB_OUTPUT"
          echo "baseline-root=" >> "$GITHUB_OUTPUT"
          echo "artifact-name=" >> "$GITHUB_OUTPUT"
          echo "needs-download=false" >> "$GITHUB_OUTPUT"
        elif [ -e "$baseline" ]; then
          echo "baseline-status=path" >> "$GITHUB_OUTPUT"
          echo "baseline-root=$baseline" >> "$GITHUB_OUTPUT"
          echo "artifact-name=" >> "$GITHUB_OUTPUT"
          echo "needs-download=false" >> "$GITHUB_OUTPUT"
        else
          echo "baseline-status=artifact" >> "$GITHUB_OUTPUT"
          echo "baseline-root=assert-ai-baseline" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$baseline" >> "$GITHUB_OUTPUT"
          echo "needs-download=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download baseline artifact
      if: ${{ steps.resolve-baseline.outputs.needs-download == 'true' }}
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ steps.resolve-baseline.outputs.artifact-name }}
        path: assert-ai-baseline

    - name: Check baseline contents
      id: baseline
      shell: bash
      run: |
        root="${{ steps.resolve-baseline.outputs.baseline-root }}"
        if [ -z "$root" ] || [ ! -e "$root" ]; then
          echo "baseline-available=false" >> "$GITHUB_OUTPUT"
          echo "baseline-root=$root" >> "$GITHUB_OUTPUT"
          echo "baseline-reason=no baseline path or artifact was available" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        scores="$(find "$root" -name scores.jsonl -type f | sort | head -n 1 || true)"
        test_set="$(find "$root" -name test_set.jsonl -type f | sort | head -n 1 || true)"
        if [ -z "$scores" ] || [ -z "$test_set" ]; then
          echo "baseline-available=false" >> "$GITHUB_OUTPUT"
          echo "baseline-root=$root" >> "$GITHUB_OUTPUT"
          echo "baseline-reason=baseline is missing scores.jsonl or test_set.jsonl" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "baseline-available=true" >> "$GITHUB_OUTPUT"
        echo "baseline-root=$root" >> "$GITHUB_OUTPUT"
        echo "baseline-scores=$scores" >> "$GITHUB_OUTPUT"
        echo "baseline-test-set=$test_set" >> "$GITHUB_OUTPUT"

    - name: Run assert-ai
      shell: bash
      env:
        AZURE_API_KEY: ${{ inputs.azure-api-key }}
        AZURE_API_BASE: ${{ inputs.azure-api-base }}
        AZURE_API_VERSION: ${{ inputs.azure-api-version }}
      run: |
        assert-ai run --config assert-ai.frozen.yaml

    - name: Locate current run
      id: locate-current
      shell: bash
      run: |
        scores="$(find "$GITHUB_WORKSPACE/assert-ai-artifacts" -name scores.jsonl -type f | sort | tail -n 1 || true)"
        if [ -z "$scores" ]; then
          echo "::error::No scores.jsonl produced by assert-ai."
          exit 1
        fi
        run_dir="$(dirname "$scores")"
        echo "current-run-root=$run_dir" >> "$GITHUB_OUTPUT"
        echo "scores-path=$scores" >> "$GITHUB_OUTPUT"
        echo "current run: $run_dir"

    - name: Write FirstRun report
      if: ${{ steps.baseline.outputs.baseline-available != 'true' }}
      shell: bash
      env:
        CURRENT_RUN_ROOT: ${{ steps.locate-current.outputs.current-run-root }}
        BASELINE_REASON: ${{ steps.baseline.outputs.baseline-reason }}
      run: |
        python <<'PY'
        import json
        import os
        from pathlib import Path

        ACTION_VERSION = "v1.0.0-rc1"

        def find_file(root: Path, name: str) -> Path | None:
            direct = root / name
            if direct.is_file():
                return direct
            matches = sorted(p for p in root.rglob(name) if p.is_file())
            return matches[0] if matches else None

        def current_stats(root: Path) -> tuple[int, float]:
            scores = find_file(root, "scores.jsonl")
            rows = []
            if scores and scores.is_file():
                for line in scores.read_text(encoding="utf-8").splitlines():
                    if line.strip():
                        rows.append(json.loads(line))
            if not rows:
                test_set = find_file(root, "test_set.jsonl")
                if test_set and test_set.is_file():
                    n = sum(1 for line in test_set.read_text(encoding="utf-8").splitlines() if line.strip())
                    return n, 0.0
                return 0, 0.0
            violations = 0
            for row in rows:
                dims = ((row.get("verdict") or {}).get("dimensions") or {})
                if any(value is True for value in dims.values()):
                    violations += 1
            return len(rows), violations / len(rows) if rows else 0.0

        root = Path(os.environ["CURRENT_RUN_ROOT"])
        n_cases, violation_rate = current_stats(root)
        report = {
            "action_version": ACTION_VERSION,
            "decision": "FirstRun",
            "n_paired_cases": 0,
            "current_n_cases": n_cases,
            "current_violation_rate": violation_rate,
            "warnings": [os.environ.get("BASELINE_REASON") or "no baseline to compare against"],
            "dimensions": [],
        }
        Path("gate_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
        Path("pr_comment.md").write_text(
            "## 🛡️ ASSERT — safety regression gate\n\n"
            "**Gate: 🆕 FirstRun**\n\n"
            f"🆕 First run on this branch — no baseline to compare. The current run is "
            f"`{n_cases}` test cases, `{violation_rate:.1%}` overall violation rate. "
            "Once this merges, future PRs will pair-test against it.\n",
            encoding="utf-8",
        )
        PY

    - name: Detect test-set drift
      id: drift
      if: ${{ steps.baseline.outputs.baseline-available == 'true' }}
      shell: bash
      env:
        BASELINE_ROOT: ${{ steps.baseline.outputs.baseline-root }}
        CURRENT_RUN_ROOT: ${{ steps.locate-current.outputs.current-run-root }}
        ARTIFACTS_ROOT: ${{ github.workspace }}/assert-ai-artifacts
      run: |
        python <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        ACTION_VERSION = "v1.0.0-rc1"

        def emit(**values: str) -> None:
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                for key, value in values.items():
                    print(f"{key}={value}", file=f)

        def find_file(root: Path, name: str) -> Path | None:
            if not root.exists():
                return None
            direct = root / name
            if direct.is_file():
                return direct
            matches = sorted(p for p in root.rglob(name) if p.is_file())
            return matches[0] if matches else None

        def sha256(path: Path) -> str:
            h = hashlib.sha256()
            with path.open("rb") as f:
                for chunk in iter(lambda: f.read(1024 * 1024), b""):
                    h.update(chunk)
            return h.hexdigest()

        def current_stats(root: Path) -> tuple[int, float]:
            scores = find_file(root, "scores.jsonl")
            rows = []
            if scores and scores.is_file():
                for line in scores.read_text(encoding="utf-8").splitlines():
                    if line.strip():
                        rows.append(json.loads(line))
            violations = 0
            for row in rows:
                dims = ((row.get("verdict") or {}).get("dimensions") or {})
                if any(value is True for value in dims.values()):
                    violations += 1
            return len(rows), violations / len(rows) if rows else 0.0

        baseline_root = Path(os.environ["BASELINE_ROOT"])
        current_root = Path(os.environ["CURRENT_RUN_ROOT"])
        artifacts_root = Path(os.environ["ARTIFACTS_ROOT"])
        baseline_test = find_file(baseline_root, "test_set.jsonl")
        current_test = find_file(current_root, "test_set.jsonl") or find_file(artifacts_root, "test_set.jsonl")

        if baseline_test is None:
            report = {
                "action_version": ACTION_VERSION,
                "decision": "FirstRun",
                "n_paired_cases": 0,
                "warnings": ["baseline is missing test_set.jsonl"],
                "dimensions": [],
            }
            Path("gate_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
            Path("pr_comment.md").write_text(
                "## 🛡️ ASSERT — safety regression gate\n\n"
                "**Gate: 🆕 FirstRun**\n\n"
                "🆕 First run on this branch — no usable baseline test set was found. "
                "Once this merges, future PRs will pair-test against it.\n",
                encoding="utf-8",
            )
            emit(**{"skip-compare": "true", "gate-verdict": "FirstRun"})
            raise SystemExit(0)

        if current_test is None:
            raise SystemExit("current run did not produce test_set.jsonl; cannot validate paired cases")

        baseline_sha = sha256(baseline_test)
        current_sha = sha256(current_test)
        if baseline_sha == current_sha:
            emit(**{
                "skip-compare": "false",
                "gate-verdict": "",
                "baseline-test-set-sha": baseline_sha,
                "current-test-set-sha": current_sha,
            })
            raise SystemExit(0)

        n_cases, violation_rate = current_stats(current_root)
        report = {
            "action_version": ACTION_VERSION,
            "decision": "TestSetChanged",
            "n_paired_cases": 0,
            "current_n_cases": n_cases,
            "current_violation_rate": violation_rate,
            "baseline_test_set_sha256": baseline_sha,
            "current_test_set_sha256": current_sha,
            "baseline_test_set_path": str(baseline_test),
            "current_test_set_path": str(current_test),
            "warnings": ["test_set.jsonl changed; paired t-test skipped"],
            "dimensions": [],
        }
        Path("gate_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
        Path("pr_comment.md").write_text(
            "## 🛡️ ASSERT — safety regression gate\n\n"
            "**Gate: 🔄 TestSetChanged**\n\n"
            f"🔄 Test set changed (baseline SHA: `{baseline_sha[:7]}`, current SHA: `{current_sha[:7]}`) — "
            "paired t-test skipped. This is a baseline-refresh PR; merge to make it the new baseline.\n",
            encoding="utf-8",
        )
        emit(**{
            "skip-compare": "true",
            "gate-verdict": "TestSetChanged",
            "baseline-test-set-sha": baseline_sha,
            "current-test-set-sha": current_sha,
        })
        PY

    - name: Run the paired gate
      if: ${{ steps.baseline.outputs.baseline-available == 'true' && steps.drift.outputs.skip-compare != 'true' }}
      shell: bash
      run: |
        python "${{ github.action_path }}/scripts/compare_runs.py" \
          --baseline "${{ steps.baseline.outputs.baseline-root }}" \
          --current "${{ steps.locate-current.outputs.current-run-root }}" \
          --out gate_report.json \
          --pr-comment pr_comment.md \
          --allow-inconclusive "${{ inputs.allow-inconclusive }}"

    - name: Append gate report to job summary
      if: ${{ always() && hashFiles('pr_comment.md') != '' }}
      shell: bash
      run: cat pr_comment.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      id: post-comment
      if: ${{ inputs.post-pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      run: |
        python "${{ github.action_path }}/scripts/post_pr_comment.py" \
          --report gate_report.json \
          --body pr_comment.md

    - name: Upload assert-ai artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: assert-ai-artifacts
        path: assert-ai-artifacts/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload gate report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: assert-ai-gate-report
        path: |
          gate_report.json
          pr_comment.md
        if-no-files-found: warn
        retention-days: 30

    - name: Decide exit code
      id: decide
      shell: bash
      run: |
        python <<'PY'
        import json
        import os
        import sys
        from pathlib import Path

        def as_bool(value: str, *, default: bool) -> bool:
            if value is None or value == "":
                return default
            return value.strip().lower() in {"1", "true", "yes", "y", "on"}

        report_path = Path("gate_report.json")
        if not report_path.is_file():
            print("::error::gate_report.json was not produced")
            sys.exit(1)

        report = json.loads(report_path.read_text(encoding="utf-8"))
        verdict = report.get("decision", "WARN")
        n_pairs = str(report.get("n_paired_cases", 0))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            print(f"gate-verdict={verdict}", file=f)
            print(f"gate-report-path={Path.cwd() / report_path}", file=f)
            print(f"n-paired-cases={n_pairs}", file=f)

        print(f"Gate verdict: {verdict}")
        fail_on_regression = as_bool("${{ inputs.fail-on-regression }}", default=True)
        allow_inconclusive = as_bool("${{ inputs.allow-inconclusive }}", default=True)

        if verdict == "FAIL" and fail_on_regression:
            print("::error::ASSERT safety regression detected — see gate_report.json and the PR comment.")
            sys.exit(1)
        if verdict == "Inconclusive" and not allow_inconclusive:
            print("::warning::ASSERT gate was inconclusive; allow-inconclusive=false keeps this as a warning.")
        PY
