# Minimal ASSERT safety gate workflow.
# Pattern: refresh the baseline on push to main and on a nightly cron, then have
# pull requests download that baseline and run a fresh paired safety gate.

name: Safety regression gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # nightly baseline refresh — catches Azure model upgrades
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: download-baseline
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: assert-ai-baseline
          path: assert-ai-baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.repository.default_branch_workflow_run_id }}  # replace with your baseline run lookup
      - uses: responsibleai/assert-action@v1
        with:
          # One behavior per YAML: every match becomes its own gated behavior.
          configs: eval/behaviors/*.yaml
          baseline: assert-ai-baseline
          azure-api-key: ${{ secrets.AZURE_API_KEY }}
          azure-api-base: ${{ secrets.AZURE_API_BASE }}
          azure-api-version: ${{ secrets.AZURE_API_VERSION }}
          # Any other LiteLLM provider works via provider-env instead:
          # provider-env: |
          #   OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: assert-ai-baseline
          path: assert-ai-artifacts/
          retention-days: 90
